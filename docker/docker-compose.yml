name: kathwada-school

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kathwada
      POSTGRES_PASSWORD: kathwada
      POSTGRES_DB: kathwada
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kathwada -d kathwada"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: creates the kathwada-documents bucket on first boot.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/kathwada-documents &&
      echo 'bucket ready'
      "

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend.Dockerfile
    env_file:
      - ../backend/.env.example
    environment:
      DATABASE_URL: postgres://kathwada:kathwada@postgres:5432/kathwada
      AWS_S3_ENDPOINT_URL: http://minio:9000
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  public-site:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        APP_DIR: apps/public-site
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    depends_on:
      - backend

  erp:
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        APP_DIR: apps/erp
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    volumes:
      - ../frontend:/app
    ports:
      - "3001:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - public-site
      - erp

volumes:
  postgres_data:
  minio_data:
