name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kathwada
          POSTGRES_PASSWORD: kathwada
          POSTGRES_DB: kathwada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kathwada -d kathwada"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://kathwada:kathwada@localhost:5432/kathwada
      DJANGO_SECRET_KEY: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check .

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate

      - name: Run tests
        working-directory: backend
        run: python -m pytest -v

      - name: Django system check
        working-directory: backend
        run: python manage.py check

  migration-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Run legacy-data migration parser tests
        working-directory: scripts
        run: python -m pytest tests/ -v
      - name: Dry-run parser against demo fixture (smoke test)
        working-directory: scripts
        run: python import_legacy_localstorage.py sample_data/khs_erp_data_v1.demo.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build public-site
        working-directory: frontend
        run: npm run build --workspace=apps/public-site

      - name: Build erp
        working-directory: frontend
        run: npm run build --workspace=apps/erp

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t kathwada-backend:ci ./backend

      - name: Build public-site image
        run: docker build -f docker/frontend.Dockerfile --build-arg APP_DIR=apps/public-site -t kathwada-public-site:ci ./frontend

      - name: Build erp image
        run: docker build -f docker/frontend.Dockerfile --build-arg APP_DIR=apps/erp -t kathwada-erp:ci ./frontend
